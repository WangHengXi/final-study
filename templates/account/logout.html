<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登出｜StudyTrack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        margin: 0;
        background: #f8f6fa;
        color: #393741;
        font-family: system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      }
    </style>
  </head>

  <body class="min-h-screen">
    <main class="mx-auto flex min-h-screen max-w-md items-center px-6 py-12">
      <section class="w-full rounded-3xl border border-[#e4dfe8] bg-white/90 p-6 shadow-sm sm:p-8">
        <a href="{% url 'learning:course-list' %}"
           class="text-sm font-bold text-[#756380] hover:underline">
          ← 回到課程列表
        </a>

        <p class="mt-8 text-sm font-bold tracking-widest text-[#82748e]">
          StudyTrack
        </p>
        <h1 class="mt-3 text-3xl font-black">登出帳號</h1>
        <p class="mt-3 text-sm leading-7 text-[#6f6777]">
          確定要登出目前帳號嗎？已儲存的學習紀錄會保留，下次登入後可繼續使用。
        </p>

        <form method="post"
              action="{% url 'account_logout' %}"
              class="mt-8">
          {% csrf_token %}

          {% if redirect_field_value %}
            <input type="hidden"
                   name="{{ redirect_field_name }}"
                   value="{{ redirect_field_value }}">
          {% endif %}

          <button type="submit"
                  class="w-full rounded-xl bg-[#ead1d7] px-5 py-3 font-bold text-[#51404a] transition hover:bg-[#dfbec7] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#82748e]">
            確認登出
          </button>
        </form>

        <a href="{% url 'learning:course-list' %}"
           class="mt-3 block rounded-xl border border-[#ded7e4] px-5 py-3 text-center font-bold text-[#756380] transition hover:bg-[#f8f6fa]">
          取消，繼續學習
        </a>
      </section>
    </main>
  </body>
</html>
