<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登入｜StudyTrack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background: #f8f6fa;
        color: #393741;
        font-family: system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      }

      form p {
        margin-bottom: 1.25rem;
      }

      form label {
        display: block;
        margin-bottom: .5rem;
        font-size: .875rem;
        font-weight: 700;
      }

      form input:not([type="hidden"]):not([type="checkbox"]) {
        box-sizing: border-box;
        width: 100%;
        padding: .75rem 1rem;
        border: 1px solid #ded7e4;
        border-radius: .75rem;
        background: #fff;
      }

      form input[type="checkbox"] {
        margin-right: .4rem;
        accent-color: #82748e;
      }

      form input:focus-visible {
        outline: 2px solid #82748e;
        outline-offset: 2px;
      }

      .helptext {
        display: block;
        margin-top: .5rem;
        color: #6f6777;
        font-size: .8rem;
        line-height: 1.6;
      }

      .helptext a,
      form p a {
        color: #756380;
        text-decoration: underline;
      }

      .errorlist {
        margin-bottom: .75rem;
        padding-left: 1.25rem;
        color: #b42338;
        font-size: .875rem;
        line-height: 1.7;
        list-style: disc;
      }
    </style>
  </head>

  <body class="min-h-screen">
    <main class="mx-auto flex min-h-screen max-w-md items-center px-6 py-12">
      <section class="w-full rounded-3xl border border-[#e4dfe8] bg-white/90 p-6 shadow-sm sm:p-8">
        <a href="{% url 'learning:course-list' %}"
           class="text-sm font-bold text-[#756380] hover:underline">
          ← 回到課程列表
        </a>

        <p class="mt-8 text-sm font-bold tracking-widest text-[#82748e]">
          StudyTrack
        </p>
        <h1 class="mt-3 text-3xl font-black">歡迎回來</h1>
        <p class="mt-3 text-sm leading-7 text-[#6f6777]">
          登入帳號，繼續整理各科錯題，記錄每一次學習與進步。
        </p>

        <form method="post"
              action="{% url 'account_login' %}"
              class="mt-8">
          {% csrf_token %}

          {{ form.as_p }}

          {% if redirect_field_value %}
            <input type="hidden"
                   name="{{ redirect_field_name }}"
                   value="{{ redirect_field_value }}">
          {% endif %}

          <button type="submit"
                  class="mt-2 w-full rounded-xl bg-[#ead1d7] px-5 py-3 font-bold text-[#51404a] transition hover:bg-[#dfbec7] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#82748e]">
            登入
          </button>
        </form>

        <p class="mt-6 text-center text-sm text-[#6f6777]">
          還沒有帳號？
          <a href="{% url 'account_signup' %}"
             class="font-bold text-[#756380] hover:underline">
            註冊
          </a>
        </p>
      </section>
    </main>
  </body>
</html>
