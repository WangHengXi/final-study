{% extends "core/base.html" %}
{% load static %}

{% block title %}課程列表｜StudyTrack{% endblock %}

{% block body_class %}min-h-screen{% endblock %}

{% block page_css %}
    <link rel="stylesheet" href="{% static 'final-study/css/course-list.css' %}">
{% endblock %}

{% block content %}
    <main class="mx-auto max-w-4xl px-6 py-16 sm:px-10 sm:py-24">

        <header class="flex flex-col gap-5 sm:flex-row sm:items-end sm:justify-between">
            <div>
              <p class="text-sm font-bold tracking-[.16em] text-[#82748e]">
                StudyTrack
              </p>
              <h1 class="mt-3 text-3xl font-black tracking-tight sm:text-5xl">
                我的課程
              </h1>
              <p class="mt-3 text-[#6f6777]">
                整理各科章節、查看錯題，累積自己的學習紀錄。
              </p>
            </div>
          
            <div class="flex flex-wrap items-center gap-3">
              <span
                id="course-count"
                class="rounded-full border border-[#ded7e4] bg-white/50 px-4 py-2 text-sm font-bold text-[#6f6777]"
                aria-live="polite"
              >
                載入課程中
              </span>
            </div>
          </header>

      <!-- 課程搜尋 -->
      <form
        id="course-search-form"
        method="get"
        action="{% url 'learning:course-list' %}"
        class="paper-card mt-8 flex gap-2 rounded-2xl p-3"
      >
        <label for="q" class="sr-only">搜尋課程</label>
        <input
          id="q"
          name="q"
          type="search"
          value="{{ keyword|default:'' }}"
          placeholder="搜尋課程名稱"
          class="min-w-0 flex-1 rounded-lg bg-transparent
            px-3 py-2 placeholder:text-[#a49baa]"
        >
        <button
          type="submit"
          class="shrink-0 rounded-xl bg-[#82748e] px-5 py-2
            font-bold text-white transition hover:bg-[#70617c]"
        >
          搜尋
        </button>
      </form>

      <!-- 課程列表 -->
      <p id="course-list-status" class="sr-only" role="status" aria-live="polite"></p>
      <div id="course-list-error" class="mt-5" role="alert" hidden></div>
      <section
        id="course-list"
        class="mt-5 space-y-4"
        aria-label="課程列表"
        aria-busy="true"
        data-course-list
        data-course-data-url="{% url 'learning:course-data' %}"
        data-login-url="{% url 'account_login' %}"
      >
        <p class="course-list__loading">正在載入課程…</p>
      </section>
      <nav id="course-pagination" class="mt-6" aria-label="課程分頁"></nav>

      <!-- 建立課程 -->
      <div class="mt-8 text-center">
        <a
          href="{% url 'learning:course-create' %}"
          class="inline-flex items-center justify-center rounded-full
            border border-[#dcbfc7] bg-[#ead1d7] px-6 py-3
            font-bold text-[#57434c] transition
            hover:-translate-y-0.5 hover:bg-[#dfbcc6]"
        >
          ＋ 建立新課程
        </a>
      </div>

    </main>
    <script src="{% static 'final-study/js/course-list.js' %}" defer></script>
{% endblock %}
