<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>課程列表</title>
  </head>
  <body>
    <h1>課程列表</h1>

    {% if keyword %}
      <p>目前搜尋：{{ keyword }}</p>
    {% endif %}

    <ul>
      {% for course in courses %}
        <li>{{ course.name }}｜{{ course.code }}</li>
      {% empty %}
        <li>目前沒有符合條件的課程。</li>
      {% endfor %}
    </ul>
  </body>
</html>
