<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>建立課程｜StudyTrack</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="min-h-screen bg-[#f8f6fa] text-[#393741]">
    <main class="mx-auto max-w-xl px-6 py-16">
      <a
        href="{% url 'learning:course-list' %}"
        class="text-sm font-semibold text-[#77717e] hover:text-[#82748e]"
      >
        ← 回到課程列表
      </a>

      <section class="mt-6 rounded-3xl border border-[#e4dfe8]
        bg-white p-6 shadow-sm sm:p-10">
        <p class="text-sm font-bold tracking-[.16em] text-[#82748e]">
          NEW COURSE
        </p>
        <h1 class="mt-3 text-3xl font-bold">建立課程</h1>
        <p class="mt-3 text-sm leading-6 text-[#77717e]">
          為新科目建立專屬空間，開始整理章節與錯題。
        </p>

        {% if error %}
          <p role="alert" class="mt-5 rounded-xl bg-red-50 px-4 py-3
            text-sm font-medium text-red-700">
            {{ error }}
          </p>
        {% endif %}

        <form
          method="post"
          action="{% url 'learning:course-create' %}"
          class="mt-8 space-y-6"
        >
          {% csrf_token %}

          <div>
            <label for="name" class="text-sm font-bold">
              課程名稱
            </label>
            <input
              id="name"
              name="name"
              type="text"
              value="{{ name|default:'' }}"
              placeholder="例：數理統計"
              maxlength="100"
              required
              class="mt-2 w-full rounded-xl border border-[#d6cddc]
                px-4 py-3 outline-none focus:border-[#82748e]
                focus:ring-2 focus:ring-[#eee8f2]"
            >
          </div>

          <div>
            <label for="code" class="text-sm font-bold">
              課程代碼
            </label>
            <input
              id="code"
              name="code"
              type="text"
              value="{{ code|default:'' }}"
              placeholder="例：STAT001"
              maxlength="12"
              aria-describedby="code-help"
              required
              class="mt-2 w-full rounded-xl border border-[#d6cddc]
                px-4 py-3 outline-none focus:border-[#82748e]
                focus:ring-2 focus:ring-[#eee8f2]"
            >
            <p id="code-help" class="mt-2 text-xs text-[#77717e]">
              最多 12 個字元，不能與現有課程代碼重複。
            </p>
          </div>

          <button
            type="submit"
            class="w-full rounded-full border border-[#dcbfc7]
              bg-[#ead1d7] px-5 py-3 font-bold text-[#57434c]
              transition hover:bg-[#dfbcc6]
              focus-visible:outline focus-visible:outline-2
              focus-visible:outline-offset-4 focus-visible:outline-[#82748e]"
          >
            建立課程
          </button>
        </form>
      </section>
    </main>
  </body>
</html>
