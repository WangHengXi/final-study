<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>課程學習設定｜StudyTrack</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      body {
        margin: 0;
        background: #f8f6fa;
        color: #393741;
        font-family: system-ui, -apple-system,
          "Microsoft JhengHei", sans-serif;
      }

      form p {
        margin-top: 1.5rem;
      }

      form label {
        display: block;
        margin-bottom: .5rem;
        font-weight: 700;
      }

      form input[type="number"] {
        box-sizing: border-box;
        width: 100%;
        padding: .8rem 1rem;
        border: 1px solid #ded7e4;
        border-radius: .75rem;
        background: white;
      }

      form input:focus-visible {
        outline: 2px solid #82748e;
        outline-offset: 2px;
      }

      .helptext {
        display: block;
        margin-top: .5rem;
        color: #6f6777;
        font-size: .875rem;
      }

      .errorlist {
        margin-top: .75rem;
        color: #b42338;
        font-size: .875rem;
      }
    </style>
  </head>

  <body class="min-h-screen">
    <main class="mx-auto max-w-xl px-5 py-12">
      <a href="{% url 'learning:course-detail' course.id %}"
         class="text-sm font-bold text-[#756380] hover:underline">
        ← 回到課程
      </a>

      <section class="mt-6 rounded-3xl border border-[#e4dfe8] bg-white p-6 sm:p-10">
        <p class="text-sm font-bold tracking-widest text-[#82748e]">
          StudyTrack
        </p>

        <h1 class="mt-3 text-3xl font-bold">課程學習設定</h1>

        <p class="mt-3 break-words text-[#6f6777]">
          {{ course.name }}
        </p>

        <form method="post"
              action="{% url 'learning:course-setting' course.id %}"
              class="mt-6">
          {% csrf_token %}

          {{ form.as_p }}

          <p class="rounded-xl bg-[#f8f6fa] p-4 text-sm leading-7 text-[#6f6777]">
            這裡先保存你的學習目標與複習間隔，目前不會自動發送提醒。
          </p>

          <button type="submit"
                  class="mt-6 w-full rounded-full bg-[#ead1d7] px-6 py-3 font-bold text-[#51404a] transition hover:bg-[#dfbec7]">
            儲存設定
          </button>
        </form>
      </section>
    </main>
  </body>
</html>
