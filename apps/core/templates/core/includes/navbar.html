<nav class="site-navbar" aria-label="主要導覽" data-testid="shared-navbar">
  <div class="site-navbar__inner">
    <a class="site-navbar__brand" href="{% url 'core:home' %}">StudyTrack</a>

    <div class="site-navbar__links">
      {% if user.is_authenticated %}
        <details class="site-navbar__menu">
          <summary aria-label="開啟備考選單">選單</summary>
          <div class="site-navbar__menu-panel">
            <a href="{% url 'core:overview' %}">備考 Overview</a>
            <a href="{% url 'learning:study-calendar' %}">行事曆</a>
            <a href="{% url 'learning:course-list' %}">我的課程</a>
            <span class="site-navbar__menu-soon">複習分析（即將推出）</span>
            <form method="post" action="{% url 'account_logout' %}">
              {% csrf_token %}
              <button type="submit">登出</button>
            </form>
          </div>
        </details>
      {% else %}
        <a href="{% url 'account_login' %}">登入</a>
        <a class="site-navbar__primary" href="{% url 'account_signup' %}">註冊</a>
      {% endif %}
    </div>
  </div>
</nav>
